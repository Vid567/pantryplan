['Tip','Zet producten die bijna op zijn meteen op je boodschappenlijst.\n\nVertrouw niet op je geheugen.'],['Tip','Begin met producten die je vaak dubbel koopt.\n\nDaar zie je het voordeel van een voorraadlijst het snelst.'],['Tip','Koppel bijwerken aan uitpakken.\n\nBoodschappen binnen? Pas meteen de aantallen aan.'],['Tip','Controleer dure producten vóór een grote boodschappenronde.\n\nEen dubbele aankoop van €15 voorkomen telt snel op.'],['Tip','Gebruik aantallen die voor jou werken: pak, fles, blik of stuk.\n\nLaat de tool bij je huishouden passen.'],['Tip','Kies bruikbaar boven perfect.\n\nEen voorraad die voor 80% klopt en echt wordt gebruikt is waardevoller dan een perfect systeem dat je opgeeft.'],['Tip','Bijna op? Voeg het direct toe aan je boodschappenlijst.\n\nVoorkom een tweede rit naar de supermarkt.'],['Tip','Bekijk wat al lang in je voorraad staat.\n\nPlan daar eerst een maaltijd mee voordat je nieuwe ingrediënten koopt.'],['Tip','Maak je boodschappenlijst vóór je honger krijgt.\n\nEen lege maag bedenkt opvallend veel extra snacks.'],['Tip','Kies het voorraadsysteem dat je volgende maand nog gebruikt.\n\nMeer functies is niet automatisch beter.']];function compose(p){return `${p[1]}\n\nProbeer PantryPlan gratis 👇\n${URL}\n\n${AI}`};const posts=raw.map((p,i)=>({id:`PP-${String(i+1).padStart(3,'0')}-nl`,theme:p[0],text:compose(p)}));const root=document.getElementById('posts');posts.forEach(p=>{const e=document.createElement('article');e.className='post';e.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count">${p.text.length}/500</div><button>Kopiëren</button>`;e.querySelector('.text').textContent=p.text;e.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(e)});if(posts.length!==50||posts.some(p=>p.text.length>500)||posts.some(p=>!p.text.includes('Vertaald met AI')))throw Error('Content QA failed');</script></body></html>
