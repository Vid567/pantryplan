<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryPlan — Nederlandse Content Creator</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:32px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.note{color:#555}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:9px 13px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}.post{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.meta{font-size:13px;color:#666;margin-bottom:8px}.text{white-space:pre-wrap}.count{font-size:12px;color:#666;margin-top:8px}.over{color:#b00020;font-weight:700}</style></head><body><h1>PantryPlan</h1><p class="note">Nederlandse Threads-content — 50 posts. 🤖 Vertaald met AI; taalfeedback is welkom.</p><div class="toolbar"><button onclick="copyAll()">Alles kopiëren</button><button onclick="downloadCsv()">CSV downloaden</button></div><div id="posts"></div><script>
const URL='https://bit.ly/pantryplan';const AI='🤖 Vertaald met AI — taalfout gezien? Stuur me een DM.';
const raw=[
['Herkenbaar','Ik kocht gisteren eieren. Thuis opende ik de koelkast. Er lagen er al 18.\n\nNiet omdat ik het vergeten was. Omdat ik geen overzicht had.'],['Herkenbaar','Ik bleef pasta kopen. Iedere week. Afgelopen weekend telde ik 11 ongeopende pakken.\n\nBlijkbaar is mijn geheugen geen voorraadadministratie.'],['Herkenbaar','Ooit in de supermarkt gestaan en gedacht: hebben we nog rijst?\n\nJe gokt. Soms heb je gelijk. En soms koop je gewoon nóg een zak.'],['Herkenbaar','Het probleem is niet boodschappen doen.\n\nHet probleem is boodschappen doen zonder te weten wat er thuis al ligt. Daar verdwijnt ongemerkt geld.'],['Herkenbaar','Ik gooide alweer eten weg.\n\nNiet omdat het gisteren over de datum ging. Maar omdat ik vergeten was dat ik het überhaupt had.'],['Herkenbaar','Mijn voorraadkast zag er vol uit. Mogelijkheden voor het avondeten? Geen.\n\nIk had blijkbaar genoeg ingrediënten, maar geen overzicht.'],['Herkenbaar','Mijn partner kocht koffie. Ik kocht koffie. We hadden al koffie.\n\nCommunicatie was niet het echte probleem. Overzicht wel.'],['Herkenbaar','Een boodschappenlijst helpt. Weten wat er al in je voorraadkast ligt helpt nog meer.\n\nEerst thuis controleren. Daarna pas kopen.'],['Herkenbaar','Ik gebruikte plakbriefjes. Daarna papier. Daarna spreadsheets.\n\nGeen van alle overleefde mijn normale boodschappendag. Voorraad bijhouden moet vooral eenvoudig zijn.'],['Herkenbaar','De goedkoopste boodschappen?\n\nDe producten die je niet voor de tweede keer koopt terwijl ze thuis nog in de kast staan.'],
['Gebruik','Je voorraad bijhouden zou niet als boekhouden moeten voelen.\n\nScan een product. Pas het aantal aan. Klaar. Hoe minder moeite, hoe groter de kans dat je het blijft gebruiken.'],['Gebruik','Een voorraadapp heeft weinig zin als invoeren langer duurt dan boodschappen doen.\n\nDe routine moet eenvoudig blijven: scannen → voorraad bekijken → aanpassen → verder.'],['Gebruik','Barcode scannen klinkt misschien klein.\n\nMaar als één scan voorkomt dat je steeds productnamen moet intypen, wordt voorraad bijhouden een stuk praktischer.'],['Gebruik','Niet iedere barcode wordt perfect herkend.\n\nDaarom moet handmatig toevoegen altijd mogelijk blijven. Automatisering wanneer het werkt, een eenvoudige uitweg wanneer het niet werkt.'],['Gebruik','Een product toevoegen is pas het begin.\n\nDe echte winst ontstaat wanneer je eenvoudig kunt aangeven: +1 gekocht, -1 gebruikt.'],['Gebruik','Een multipack gekocht? Dan wil je niet alleen weten dát je iets hebt. Je wilt weten hoeveel.\n\n6 flessen is iets anders dan 1 verpakking.'],['Gebruik','Je telefoon heb je in de supermarkt toch al bij je.\n\nBekijk tijdens het winkelen wat je nog hebt voordat iets opnieuw in je mandje belandt.'],['Gebruik','Voorraad bijhouden werkt alleen als aanpassen snel genoeg is.\n\nProduct gebruikt? Tik op -. Nieuwe gekocht? Tik op +. Geen ingewikkelde administratie nodig.'],['Gebruik','Soms weet je precies wat je nodig hebt. Soms ontdek je het pas wanneer je voorraad bijna op is.\n\nDaarom horen voorraad en boodschappenlijst bij elkaar.'],['Gebruik','Een foto kan sneller herkenbaar zijn dan een productnaam.\n\nVooral wanneer je tientallen producten in je voorraad hebt. Minder zoeken, sneller herkennen.'],
['Besparen','Een voorraadlijst hoeft niet perfect te zijn om geld te besparen.\n\nAls hij je één dubbele aankoop per week bespaart, doet hij al nuttig werk.'],['Besparen','Voedselverspilling begint soms met drie woorden: “Ik wist niet…”\n\nIk wist niet dat we het hadden. Ik wist niet hoeveel. Ik wist niet dat het achterin stond.'],['Besparen','Een volle voorraadkast kan alsnog leiden tot extra boodschappen.\n\nOmdat “vol” niet hetzelfde is als “weten wat erin zit”. Maak je voorraad zichtbaar.'],['Besparen','Voorraad controleren vóór het boodschappen doen kost een paar minuten.\n\nDubbele producten kopen, opslaan en uiteindelijk weggooien kost meer.'],['Besparen','Boodschappen besparen begint niet altijd bij aanbiedingen zoeken.\n\nSoms begint het met gebruiken wat je al hebt. Eerst voorraad. Dan boodschappenlijst.'],['Besparen','Voorraad is niet alleen eten. Denk ook aan schoonmaakmiddelen, toiletpapier, verzorgingsproducten en huishoudelijke artikelen.'],['Besparen','“Volgens mij hebben we nog genoeg.” is geen voorraadstatus.\n\n3 pakken pasta, 1 fles afwasmiddel en 0 rollen keukenpapier is duidelijker.'],['Besparen','Een boodschappenlijst maken vanuit je geheugen is vragen om vergeten producten.\n\nBegin met wat bijna op is. Voeg daarna toe wat je deze week echt nodig hebt.'],['Besparen','Het doel is niet om iedere blik bonen perfect te administreren.\n\nHet doel is minder vaak denken: “Hadden we dit niet al?”'],['Besparen','Een goed voorraadritme kan simpel zijn:\nNa boodschappen → voorraad verhogen.\nNa gebruik → voorraad verlagen.\nVoor boodschappen → lijst controleren.'],
['Beta','PantryPlan is nog een Beta. Dat betekent: het werkt, maar echte gebruikers helpen bepalen wat beter moet.\n\nZie je iets onhandigs? Juist die feedback is waardevol.'],['Beta','Ik bouw PantryPlan niet voor perfecte voorraadkasten.\n\nIk bouw het voor normale huishoudens waar dingen opraken, iemand iets vergeet en soms dubbel wordt gekocht.'],['Beta','Een Beta hoeft niet honderd functies te hebben.\n\nLiever een paar functies die echt helpen: voorraad bekijken, producten toevoegen, aantallen aanpassen en boodschappen bijhouden.'],['Beta','De beste test voor PantryPlan? Gebruik het tijdens een echte boodschappendag.\n\nMet jouw koelkast, jouw voorraadkast en jouw boodschappen.'],['Beta','Ik wil vooral weten waar PantryPlan in het echte leven lastig wordt.\n\nScannen? Voorraad aanpassen? Boodschappenlijst? Foto’s? Spraak? Beta-feedback bepaalt wat we verbeteren.'],['Beta','Een huishoudapp moet tijd besparen.\n\nNiet een nieuwe taak worden die je iedere avond moet bijwerken. Daarom is eenvoud belangrijker dan zoveel mogelijk functies.'],['Beta','Wat zou jij toevoegen aan een voorraadapp? Betere productherkenning, een slimmer boodschappenlijstje, delen met gezinsleden of iets anders?'],['Beta','Begin klein. Voeg niet meteen je hele huis toe.\n\nTest PantryPlan eerst met 10 producten die je vaak koopt. Werkt de routine? Breid daarna uit.'],['Beta','Een Beta testen betekent niet alleen zoeken naar fouten.\n\nVertel ook wat verrassend handig werkt. Dat helpt net zo goed bepalen welke onderdelen belangrijk zijn.'],['Beta','PantryPlan probeert één alledaags probleem kleiner te maken:\n\nniet weten wat je thuis hebt terwijl je in de winkel staat. Simpel probleem, verrassend vaak duur.'],
['Tip','Voorraadtip: zet producten die bijna op zijn niet alleen in je hoofd.\n\nMaak ze zichtbaar op je boodschappenlijst. Je geheugen heeft al genoeg te doen.'],['Tip','Voorraadtip: begin met producten die je vaak dubbel koopt.\n\nDat zijn waarschijnlijk de makkelijkste plekken om meteen voordeel uit een voorraadlijst te halen.'],['Tip','Voorraadtip: maak voorraad bijwerken onderdeel van een bestaande gewoonte.\n\nBoodschappen uitpakken? Werk meteen de aantallen bij.'],['Tip','Voorraadtip: controleer vóór een grote boodschappenronde eerst de producten die je duur vindt.\n\nEen dubbele aankoop van €15 is interessanter om te voorkomen dan één van €1.'],['Tip','Voorraadtip: gebruik aantallen die voor jou logisch zijn.\n\nPak, fles, blik of stuk. Een voorraadtool moet jouw huishouden ondersteunen, niet andersom.'],['Tip','Voorraadtip: begin niet met perfectie.\n\nEen voorraad die voor 80% klopt en echt wordt gebruikt is nuttiger dan een perfect systeem dat je na drie dagen opgeeft.'],['Tip','Voorraadtip: zie je iets dat bijna op is? Voeg het meteen toe aan je boodschappenlijst.\n\n“Dat onthoud ik wel” eindigt vaak in een tweede bezoek aan de supermarkt.'],['Tip','Voorraadtip: controleer af en toe wat al lang in je voorraad staat.\n\nMisschien kun je daar eerst een maaltijd omheen plannen voordat je nieuwe ingrediënten koopt.'],['Tip','Voorraadtip: maak je boodschappenlijst vóórdat je honger hebt.\n\nEen lege maag is bijzonder goed in het bedenken van snacks die je ineens “nodig” hebt.'],['Tip','Voorraadtip: het beste voorraadsysteem is niet het systeem met de meeste functies.\n\nHet is het systeem dat je ook volgende maand nog gebruikt.']
];
function compose(p){return `${p[1]}\n\nProbeer PantryPlan gratis 👇\n${URL}\n\n${AI}`};const posts=raw.map((p,i)=>({id:`PP-${String(i+1).padStart(3,'0')}-nl`,theme:p[0],text:compose(p)}));const root=document.getElementById('posts');posts.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${p.text.length>500?'over':''}">${p.text.length}/500</div><button>Kopiëren</button>`;el.querySelector('.text').textContent=p.text;el.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(el)});function copyAll(){navigator.clipboard.writeText(posts.map(p=>`${p.id}\n${p.text}`).join('\n\n---\n\n'))}function downloadCsv(){const q=v=>'"'+String(v).replaceAll('"','""')+'"';const csv='\ufeff'+[['id','theme','text'],...posts.map(p=>[p.id,p.theme,p.text])].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pantryplan-content-nl.csv';a.click()}if(posts.length!==50||posts.some(p=>p.text.length>500)||posts.some(p=>!p.text.includes('Vertaald met AI')))throw new Error('Content QA failed');
</script></body></html>
