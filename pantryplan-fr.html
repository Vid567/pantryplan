<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const locale='fr-FR'; localStorage.setItem('pantryPlanLocale',locale); const frame=document.getElementById('app'); const child=new URL('pantryplan-app.html',location.href); if(new URLSearchParams(location.search).get('join')==='beta')child.searchParams.set('join','beta'); frame.src=child.href;
const EXACT=new Map([
['Pantry','Garde-manger'],['What you have at home.','Ce que vous avez chez vous.'],['Shopping list','Liste de courses'],['Check things off as you shop. Add whatever you spot.','Cochez les produits pendant vos courses et ajoutez ce dont vous avez besoin.'],['Data & backup','Données et sauvegarde'],['Items','Produits'],['Running low','Stock faible'],['＋ Add item','＋ Ajouter un produit'],['＋ Add to list','＋ Ajouter à la liste'],['Speak to add or update','Parlez pour ajouter ou mettre à jour'],['Speak to add or remove','Parlez pour ajouter ou supprimer'],['Listening… tap to stop','Écoute en cours… touchez pour arrêter'],['● Recording — speak now','● Enregistrement — parlez maintenant'],['Undo last','Annuler la dernière action'],['Just added by voice','Ajouté par la voix'],['Done shopping — move bought items to pantry','Courses terminées — déplacer les achats vers le garde-manger'],['Join the Free Beta','Rejoindre la bêta gratuite'],['Join Free Beta','Rejoindre la bêta gratuite'],['Export data','Exporter les données'],['Import data','Importer les données'],['Export','Exporter'],['Import','Importer'],['Backup','Sauvegarde'],['Add item','Ajouter un produit'],['Edit item','Modifier le produit'],['Add to list','Ajouter à la liste'],['Edit shopping item','Modifier le produit de la liste'],['Name','Nom'],['Quantity','Quantité'],['Category','Catégorie'],['Low stock threshold','Seuil de stock faible'],['Photo','Photo'],['Take / choose photo','Prendre / choisir une photo'],['Remove','Supprimer'],['Save','Enregistrer'],['Cancel','Annuler'],['Delete','Supprimer'],['Close','Fermer'],['Done','Terminé'],['Edit','Modifier'],['Staples','Épicerie'],['Fresh','Produits frais'],['Frozen','Surgelés'],['Drinks','Boissons'],['Snacks','Snacks'],['Household','Maison'],['Other','Autres'],['Pantry is empty.','Votre garde-manger est vide.'],['Your shopping list is empty.','Votre liste de courses est vide.'],['More','Plus'],['Shopping','Courses'],['Tap a product name to edit details or add a photo.','Touchez le nom d’un produit pour modifier ses informations ou ajouter une photo.'],['Bought — add to pantry','Acheté — ajouter au garde-manger'],['to pantry','au garde-manger'],['Microphone access denied','Accès au microphone refusé'],['No microphone was found','Aucun microphone détecté'],['Voice not supported in this browser — try Chrome','La reconnaissance vocale n’est pas prise en charge dans ce navigateur — essayez Chrome'],['Voice recognition needs a network connection in this browser','La reconnaissance vocale nécessite une connexion Internet dans ce navigateur'],['Saved','Enregistré'],['Removed','Supprimé'],['Added','Ajouté'],['Updated','Mis à jour'],['Backup restored ✓','Sauvegarde restaurée ✓'],["That file didn't look right",'Ce fichier ne semble pas être une sauvegarde valide'],['Storage is full. The last change was not saved.','Le stockage est plein. La dernière modification n’a pas été enregistrée.'],['Saved data could not be read. Import a backup to restore it.','Les données enregistrées n’ont pas pu être lues. Importez une sauvegarde pour les restaurer.']
]);
const PHRASES=[['Say as many items as you like —','Dites autant de produits que vous voulez —'],['pause briefly between items','faites une courte pause entre les produits'],['Stops automatically after 10 seconds of silence.','S’arrête automatiquement après 10 secondes de silence.'],['Try:','Essayez :'],['out of eggs','plus d’œufs'],['remove pasta','supprimer les pâtes'],['got the milk','lait acheté'],['move bought items to pantry','déplacer les achats vers le garde-manger'],['moved to pantry','déplacé vers le garde-manger'],['item moved to pantry','produit déplacé vers le garde-manger'],['items moved to pantry','produits déplacés vers le garde-manger'],['pcs total','unités au total'],['shopping list','liste de courses'],['Shopping list','Liste de courses'],['pantry','garde-manger'],['Pantry','Garde-manger']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(EXACT.has(trim))return raw.replace(trim,EXACT.get(trim));let out=raw;for(const [a,b] of PHRASES)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
function normalizeFrenchVoice(text){
 let s=String(text||'').toLowerCase().trim().replace(/œ/g,'oe').replace(/[’']/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const nums={un:'one',une:'one',deux:'two',trois:'three',quatre:'four',cinq:'five',six:'six',sept:'seven',huit:'eight',neuf:'nine',dix:'ten'};
 s=s.split(/\s+/).map(x=>nums[x]||x).join(' ');
 s=s.replace(/\s+et\s+/g,' and ').replace(/\bsacs? de\b/g,'bags of').replace(/\bpaquets? de\b/g,'packs of');
 s=s.replace(/^(supprime|supprimer|enleve|enlever|retire|retirer)\s+(le|la|les|du|de la|des)?\s*/,'remove ')
    .replace(/^(plus de|plus d|il n y a plus de|il n y a plus d|il ny a plus de|il ny a plus d)\s+(le|la|les|du|de la|des)?\s*/,'out of ')
    .replace(/^(achete|achetee|achetes|achetees|j ai achete|jai achete)\s+(le|la|les|du|de la|des)?\s*/,'got ');
 return s.trim();
}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}try{if(typeof w.toggleMic==='function'){const src=w.toggleMic.toString(),patched=src.replace(/rec\.lang\s*=\s*[^;]+;/,`rec.lang='fr-FR';`);if(patched!==src)w.eval(`toggleMic=${patched}`);}if(typeof w.handleVoice==='function'){const original=w.handleVoice;w.handleVoice=function(ctx,text){return original.call(this,ctx,normalizeFrenchVoice(text));};}}catch(e){console.warn('French PantryPlan voice patch unavailable',e)}d.documentElement.lang='fr';translate(d.body);try{if(typeof w.toast==='function'){const o=w.toast;w.toast=(m,...r)=>o(tr(m),...r);}const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),1000);});
</script></body></html>
