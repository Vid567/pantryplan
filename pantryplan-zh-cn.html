<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const locale='zh-CN';localStorage.setItem('pantryPlanLocale',locale);const frame=document.getElementById('app');const child=new URL('pantryplan-app.html',location.href);if(new URLSearchParams(location.search).get('join')==='beta')child.searchParams.set('join','beta');frame.src=child.href;
const EXACT=new Map([['Pantry','储藏室'],['What you have at home.','查看家里现有的物品。'],['Shopping list','购物清单'],['Check things off as you shop. Add whatever you spot.','购物时勾选商品，并随时添加需要购买的物品。'],['Data & backup','数据与备份'],['Items','物品'],['Running low','库存不足'],['＋ Add item','＋ 添加物品'],['＋ Add to list','＋ 添加到清单'],['Speak to add or update','通过语音添加或更新'],['Speak to add or remove','通过语音添加或删除'],['Listening… tap to stop','正在聆听…点击停止'],['● Recording — speak now','● 正在录音 — 请说话'],['Undo last','撤销上一步'],['Just added by voice','刚刚通过语音添加'],['Done shopping — move bought items to pantry','购物完成 — 将已购买物品移入储藏室'],['Join the Free Beta','参加免费测试版'],['Join Free Beta','参加免费测试版'],['Export data','导出数据'],['Import data','导入数据'],['Export','导出'],['Import','导入'],['Backup','备份'],['Add item','添加物品'],['Edit item','编辑物品'],['Add to list','添加到清单'],['Edit shopping item','编辑购物物品'],['Name','名称'],['Quantity','数量'],['Category','类别'],['Low stock threshold','低库存提醒数量'],['Photo','照片'],['Take / choose photo','拍摄 / 选择照片'],['Remove','删除'],['Save','保存'],['Cancel','取消'],['Delete','删除'],['Close','关闭'],['Done','完成'],['Edit','编辑'],['Staples','常备食品'],['Fresh','生鲜'],['Frozen','冷冻食品'],['Drinks','饮料'],['Snacks','零食'],['Household','家居用品'],['Other','其他'],['Pantry is empty.','储藏室目前为空。'],['Your shopping list is empty.','购物清单目前为空。'],['More','更多'],['Shopping','购物'],['Tap a product name to edit details or add a photo.','点击物品名称可编辑详细信息或添加照片。'],['Bought — add to pantry','已购买 — 添加到储藏室'],['to pantry','到储藏室'],['Microphone access denied','麦克风访问被拒绝'],['No microphone was found','未找到麦克风'],['Voice not supported in this browser — try Chrome','此浏览器不支持语音识别 — 请尝试 Chrome'],['Voice recognition needs a network connection in this browser','此浏览器中的语音识别需要网络连接'],['Saved','已保存'],['Removed','已删除'],['Added','已添加'],['Updated','已更新'],['Backup restored ✓','备份已恢复 ✓'],["That file didn't look right",'该文件似乎不是有效的备份文件'],['Storage is full. The last change was not saved.','存储空间已满。最后一次更改未保存。'],['Saved data could not be read. Import a backup to restore it.','无法读取已保存的数据。请导入备份进行恢复。']]);
const PHRASES=[['Say as many items as you like —','可以连续说出多个物品 —'],['pause briefly between items','每个物品之间稍作停顿'],['Stops automatically after 10 seconds of silence.','静音 10 秒后自动停止。'],['Try:','例如：'],['out of eggs','鸡蛋没有了'],['remove pasta','删除面条'],['got the milk','牛奶买好了'],['move bought items to pantry','将已购买物品移入储藏室'],['moved to pantry','已移入储藏室'],['item moved to pantry','个物品已移入储藏室'],['items moved to pantry','个物品已移入储藏室'],['pcs total','件'],['shopping list','购物清单'],['Shopping list','购物清单'],['pantry','储藏室'],['Pantry','储藏室']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(EXACT.has(trim))return raw.replace(trim,EXACT.get(trim));let out=raw;for(const [a,b] of PHRASES)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
function normalizeChineseVoice(text){let s=String(text||'').trim().replace(/[，、；]/g,',').replace(/[。！]/g,'');const nums={'一':'one','一个':'one','两':'two','两个':'two','二':'two','三':'three','四':'four','五':'five','六':'six','七':'seven','八':'eight','九':'nine','十':'ten'};for(const [a,b] of Object.entries(nums))s=s.split(a).join(' '+b+' ');s=s.replace(/和/g,' and ').replace(/袋/g,' bags of ').replace(/包/g,' packs of ');s=s.replace(/^(删除|移除|去掉)/,'remove ').replace(/^(.+?)(没有了|没了|用完了)$/,'out of $1').replace(/^(.+?)(买好了|买了)$/,'got $1');return s.replace(/\s+/g,' ').trim();}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}try{if(typeof w.toggleMic==='function'){const src=w.toggleMic.toString(),patched=src.replace(/rec\.lang\s*=\s*[^;]+;/,`rec.lang='zh-CN';`);if(patched!==src)w.eval(`toggleMic=${patched}`);}if(typeof w.handleVoice==='function'){const original=w.handleVoice;w.handleVoice=function(ctx,text){return original.call(this,ctx,normalizeChineseVoice(text));};}}catch(e){console.warn('Simplified Chinese PantryPlan voice patch unavailable',e)}d.documentElement.lang='zh-CN';translate(d.body);try{if(typeof w.toast==='function'){const o=w.toast;w.toast=(m,...r)=>o(tr(m),...r);}const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),1000);});
</script></body></html>
