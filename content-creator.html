<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PantryPlan Content Creator</title>
<style>
:root{--amber:#b45309;--amber-dark:#92400e;--amber-light:#fef3e2;--green:#059669;--green-dark:#047857;--bg:#faf7f2;--surface:#fff;--text:#1c1917;--muted:#78716c;--border:#e7e0d4;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800;color:var(--amber)}.sub{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}select,input,button{font:inherit}select,input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green-dark)}.secondary{background:var(--amber-light);color:var(--amber-dark)}.ghost{background:#fff;border:1px solid var(--border)}.danger{color:var(--danger)}.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.number{font-weight:800;color:var(--amber)}.theme{font-size:12px;background:var(--amber-light);color:var(--amber-dark);padding:4px 8px;border-radius:999px}.post{white-space:pre-wrap;background:#fcfbf8;border:1px solid var(--border);border-radius:10px;padding:13px;min-height:255px;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:86px}.scheduled{border-color:var(--green);box-shadow:0 0 0 2px #d1fae5}.planner{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:10px}th{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:25px}.notice{font-size:13px;color:var(--muted);margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.post{min-height:auto}.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="brand">🥫 PantryPlan Content Creator</div><div class="sub">Copy and plan 25 English PantryPlan Threads posts.</div></div>
    <div class="top-actions"><a class="btn secondary" href="index.html">PantryPlan</a><a class="btn secondary" href="PantryPlan-GUIDE.html">Guide</a><button class="btn secondary" onclick="downloadCSV()">Download CSV</button></div>
  </div>
  <section class="panel">
    <div class="controls">
      <div><label for="themeFilter">Theme</label><select id="themeFilter" onchange="renderPosts()"><option value="all">All themes</option><option>Relatable story</option><option>Waste & duplicates</option><option>Shopping clarity</option><option>Easy input</option><option>Simple & private</option></select></div>
      <div><label for="count">Show posts</label><select id="count" onchange="renderPosts()"><option value="5">5</option><option value="10">10</option><option value="25" selected>25</option></select></div>
      <div><label for="startDate">Planning start date</label><input id="startDate" type="date"></div>
      <div><label for="postsPerDay">Posts per day</label><select id="postsPerDay"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div>
      <button class="btn primary" onclick="autoPlan()">Auto-plan visible posts</button>
    </div>
    <div class="stats"><span id="postCount"></span><span id="plannedCount"></span><span>Default times: 08:00 · 12:30 · 18:00</span></div>
    <div class="notice">Copy a post, paste it into Threads, and use the Threads clock to schedule it. Every post already includes the PantryPlan CTA and link.</div>
  </section>
  <section id="posts" class="grid"></section>
  <section class="panel planner">
    <div class="card-head"><h2 style="margin:0;font-size:20px">Planner</h2><button class="btn ghost danger" onclick="clearPlan()">Clear plan</button></div>
    <div id="planner"></div>
  </section>
</main>
<div id="toast" class="toast">Copied</div>
<script>
const link='https://bit.ly/pantryplan';
const posts=[
{theme:'Relatable story',hook:'I bought eggs yesterday.',body:'Got home.\nOpened the fridge.\n\nThere were already 18 eggs.\n\nNot because I forgot.\nBecause I had no overview.'},
{theme:'Relatable story',hook:'I kept buying pasta.',body:'Every week.\n\nLast weekend I counted...\n\n11 unopened packs.\n\nApparently my memory is not inventory.'},
{theme:'Shopping clarity',hook:'Ever stood in the supermarket thinking...',body:'Do we still have rice?\n\nYou guess.\nSometimes you are right.\n\nUsually you buy another bag.'},
{theme:'Waste & duplicates',hook:'The problem is not shopping.',body:'It is shopping without knowing\nwhat is already at home.\n\nThat is where money disappears.'},
{theme:'Waste & duplicates',hook:'I threw away food again.',body:'Not because it expired yesterday.\n\nBecause I forgot it existed.'},
{theme:'Relatable story',hook:'My cupboard looked full.',body:'Dinner options?\nNone.\n\nTurns out I had ingredients...\n\nJust not an overview.'},
{theme:'Waste & duplicates',hook:'We both bought coffee.',body:'My partner bought coffee.\nI bought coffee.\n\nWe already had coffee.\n\nCommunication was not the problem.'},
{theme:'Shopping clarity',hook:'A shopping list helps.',body:'Knowing what is already in your pantry\nhelps even more.'},
{theme:'Relatable story',hook:'I used sticky notes.',body:'Then paper.\nThen spreadsheets.\n\nNone of them survived grocery day.'},
{theme:'Waste & duplicates',hook:'The cheapest groceries...',body:'Are the ones you do not buy twice.'},
{theme:'Easy input',hook:'Typing milk, bread and eggs gets old.',body:'Saying them out loud\ntakes seconds.\n\nThat is why PantryPlan supports voice input.'},
{theme:'Easy input',hook:'I started adding photos to pantry items.',body:'Finding the right product\nbecame much easier.\n\nFunny how one picture\ncan save so much time.'},
{theme:'Shopping clarity',hook:'Most people organize their shopping.',body:'Very few organize\nthe place they are shopping for.'},
{theme:'Shopping clarity',hook:'Every grocery trip used to include:',body:'I think we need...\n\nNow I can check before I buy.'},
{theme:'Simple & private',hook:'My memory is not bad.',body:'It is just overloaded.\n\nSo I stopped relying on it.'},
{theme:'Waste & duplicates',hook:'Food waste is not always about buying too much.',body:'Sometimes it is simply forgetting\nwhat you already own.'},
{theme:'Shopping clarity',hook:'One small habit.',body:'Check the pantry.\nThen go shopping.\n\nThat is it.'},
{theme:'Simple & private',hook:'No subscription.',body:'No account.\nNo complicated setup.\n\nJust open it and start.'},
{theme:'Simple & private',hook:'Everything stays on your device.',body:'That is exactly where\nI want my pantry list.'},
{theme:'Simple & private',hook:'Internet down?',body:'No problem.\n\nYour pantry still works offline\nafter the first load.'},
{theme:'Simple & private',hook:'The goal is not a perfect pantry.',body:'The goal is finding things\nwhen you need them.'},
{theme:'Waste & duplicates',hook:'One forgotten can.',body:'One forgotten bottle.\nOne forgotten bag.\n\nMultiply that by a year.'},
{theme:'Relatable story',hook:'I do not need another productivity app.',body:'I just need to know\nwhether I already have ketchup.'},
{theme:'Shopping clarity',hook:'The best grocery decision...',body:'Sometimes happens\nbefore leaving home.'},
{theme:'Shopping clarity',hook:'A simple pantry creates simpler shopping.',body:'Less guessing.\nLess waste.\nLess spending.\n\nThat is the goal.'}
].map((p,i)=>({...p,id:i+1,text:`${p.hook}\n\n${p.body}\n\nTry PantryPlan free 👇\n${link}`}));
let plan=JSON.parse(localStorage.getItem('pantryPlanContentPlan')||'{}');
function visiblePosts(){const theme=document.getElementById('themeFilter').value;const count=Number(document.getElementById('count').value);return posts.filter(p=>theme==='all'||p.theme===theme).slice(0,count)}
function renderPosts(){const list=visiblePosts();document.getElementById('posts').innerHTML=list.map(p=>`<article class="card ${plan[p.id]?'scheduled':''}"><div class="card-head"><span class="number">Post ${p.id}</span><span class="theme">${p.theme}</span></div><div class="post">${escapeHtml(p.text)}</div><div class="actions"><button class="btn primary" onclick="copyPost(${p.id})">Copy</button><button class="btn secondary" onclick="planOne(${p.id})">${plan[p.id]?'Change time':'Plan'}</button></div></article>`).join('');document.getElementById('postCount').textContent=`${list.length} posts shown`;renderPlanner()}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function copyPost(id){await navigator.clipboard.writeText(posts.find(p=>p.id===id).text);toast('Post copied — paste it into Threads')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function planOne(id){const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',plan[id]||'');if(!value)return;plan[id]=value;savePlan();renderPosts()}
function autoPlan(){const start=document.getElementById('startDate').value;if(!start){alert('Choose a planning start date first.');return}const perDay=Number(document.getElementById('postsPerDay').value),times=['08:00','12:30','18:00'];visiblePosts().forEach((p,index)=>{const day=new Date(start+'T12:00:00');day.setDate(day.getDate()+Math.floor(index/perDay));const y=day.getFullYear(),m=String(day.getMonth()+1).padStart(2,'0'),d=String(day.getDate()).padStart(2,'0');plan[p.id]=`${y}-${m}-${d} ${times[index%perDay]}`});savePlan();renderPosts();toast('Planning created')}
function savePlan(){localStorage.setItem('pantryPlanContentPlan',JSON.stringify(plan))}
function clearPlan(){if(confirm('Clear the complete content plan?')){plan={};savePlan();renderPosts()}}
function renderPlanner(){const rows=posts.filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));document.getElementById('plannedCount').textContent=`${rows.length} planned`;document.getElementById('planner').innerHTML=rows.length?`<table><thead><tr><th>Date & time</th><th>Post</th><th>Opening</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${plan[p.id]}</td><td>${p.id}</td><td>${escapeHtml(p.hook.replaceAll('\n',' / '))}</td><td><button class="btn ghost" onclick="copyPost(${p.id})">Copy</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posts planned yet.</div>'}
function downloadCSV(){const rows=[['Post','Theme','Opening','Full post','Planned date/time'],...posts.map(p=>[p.id,p.theme,p.hook,p.text,plan[p.id]||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PantryPlan-Threads-25-posts.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('startDate').value=new Date(Date.now()+86400000).toISOString().slice(0,10);renderPosts();
</script>
</body>
</html>
