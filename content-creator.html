<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PantryPlan Threads Content</title>
<style>
:root{--amber:#b45309;--amber-dark:#92400e;--amber-light:#fef3e2;--green:#059669;--bg:#faf7f2;--surface:#fff;--text:#1c1917;--muted:#78716c;--border:#e7e0d4;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800;color:var(--amber)}.sub{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}select,input,button{font:inherit}select,input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}.primary{background:var(--green);color:#fff}.secondary{background:var(--amber-light);color:var(--amber-dark)}.ghost{background:#fff;border:1px solid var(--border)}.danger{color:var(--danger)}.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.number{font-weight:800;color:var(--amber)}.theme{font-size:12px;background:var(--amber-light);color:var(--amber-dark);padding:4px 8px;border-radius:999px}.post{white-space:pre-wrap;background:#fcfbf8;border:1px solid var(--border);border-radius:10px;padding:13px;min-height:225px;font-size:15px}.actions{display:flex;gap:8px}.actions button{flex:1}.scheduled{border-color:var(--green);box-shadow:0 0 0 2px #d1fae5}.planner{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:10px}th{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:25px}.notice{font-size:13px;color:var(--muted);margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.post{min-height:auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="brand">🥫 PantryPlan Threads Content</div><div class="sub">Copy and plan the first 12 English PantryPlan posts.</div></div>
    <div class="top-actions"><a class="btn secondary" href="index.html">PantryPlan</a><button class="btn secondary" onclick="downloadCSV()">Download CSV</button></div>
  </div>
  <section class="panel">
    <div class="controls">
      <div><label for="themeFilter">Theme</label><select id="themeFilter" onchange="renderPosts()"><option value="all">All themes</option><option>Know what you have</option><option>Easy input</option><option>Shopping flow</option><option>Simple habits</option></select></div>
      <div><label for="startDate">Planning start date</label><input id="startDate" type="date"></div>
      <div><label for="postsPerDay">Posts per day</label><select id="postsPerDay"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div>
      <button class="btn primary" onclick="autoPlan()">Auto-plan posts</button>
    </div>
    <div class="stats"><span id="postCount"></span><span id="plannedCount"></span><span>Default times: 08:00 · 12:30 · 18:00</span></div>
    <div class="notice">Copy a post here, paste it into Threads, and use the clock in Threads to schedule it.</div>
  </section>
  <section id="posts" class="grid"></section>
  <section class="panel planner">
    <div class="card-head"><h2 style="margin:0;font-size:20px">Planner</h2><button class="btn ghost danger" onclick="clearPlan()">Clear plan</button></div>
    <div id="planner"></div>
  </section>
</main>
<div id="toast" class="toast">Copied</div>
<script>
const link='https://vid567.github.io/pantryplan/';
const posts=[
{theme:'Know what you have',hook:'How many times have you bought something…',body:'only to discover you already had three at home?\n\nPantryPlan helps you check your pantry before you shop.\n\nLess guessing.\nFewer duplicates.\nMore control.'},
{theme:'Know what you have',hook:'A shopping list tells you what to buy.',body:'But does it tell you what you already have?\n\nPantryPlan connects your pantry and shopping list, so you can see both sides of the grocery trip.'},
{theme:'Know what you have',hook:'The most expensive groceries are sometimes the ones you buy twice.',body:'Before adding something to your shopping list, check your pantry.\n\nThat small habit can save money and reduce waste.'},
{theme:'Simple habits',hook:'Pantry apps should save time.',body:'They should not turn your kitchen into an administration project.\n\nPantryPlan is built around a simple idea:\n\nAdd it.\nFind it.\nShop for it when you need it.'},
{theme:'Know what you have',hook:'Forgot whether you still have milk?',body:'Check your pantry on your phone.\n\nNo searching through cupboards.\nNo messaging someone at home.\nNo buying another carton “just in case.”'},
{theme:'Easy input',hook:'Typing every product name is not always convenient.',body:'With PantryPlan, you can use voice input to add an item.\n\nSay it clearly.\nCheck the name.\nAdd it to your pantry or shopping list.'},
{theme:'Easy input',hook:'Sometimes a product name is not enough.',body:'Tap the product to open its details and add a photo.\n\nThat makes it easier to recognize the exact product later.'},
{theme:'Easy input',hook:'A pantry list only works when updating it feels easy.',body:'That is why PantryPlan keeps the important actions visible:\n\nAdd an item.\nOpen its details.\nAdd a photo.\nMove it to your shopping list.'},
{theme:'Simple habits',hook:'Your pantry does not need to be perfectly organized.',body:'You only need to know what is there.\n\nStart with the products you buy most often:\n\nMilk.\nEggs.\nRice.\nPasta.\nCoffee.\n\nSmall start. Useful result.'},
{theme:'Shopping flow',hook:'Bought an item from your shopping list?',body:'Do not delete it and forget about it.\n\nMove it back into your pantry.\n\nNow your list shows what you need — and your pantry shows what you have.'},
{theme:'Shopping flow',hook:'A good grocery app should answer two questions quickly:',body:'Do I already have it?\n\nDo I need to buy it?\n\nThat is exactly what PantryPlan is designed to help with.'},
{theme:'Shopping flow',hook:'Before your next grocery trip:',body:'Open PantryPlan.\nCheck what you already have.\nAdd only what you need.\n\nA calmer shopping trip can start before you leave home.'}
].map((p,i)=>({...p,id:i+1,text:`${p.hook}\n\n${p.body}\n\nTry PantryPlan free 👇\n${link}`}));
let plan=JSON.parse(localStorage.getItem('pantryPlanContentPlan')||'{}');
function visiblePosts(){const theme=document.getElementById('themeFilter').value;return posts.filter(p=>theme==='all'||p.theme===theme)}
function renderPosts(){const list=visiblePosts();document.getElementById('posts').innerHTML=list.map(p=>`<article class="card ${plan[p.id]?'scheduled':''}"><div class="card-head"><span class="number">Post ${p.id}</span><span class="theme">${p.theme}</span></div><div class="post">${escapeHtml(p.text)}</div><div class="actions"><button class="btn primary" onclick="copyPost(${p.id})">Copy</button><button class="btn secondary" onclick="planOne(${p.id})">${plan[p.id]?'Change time':'Plan'}</button></div></article>`).join('');document.getElementById('postCount').textContent=`${list.length} posts shown`;renderPlanner()}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function copyPost(id){await navigator.clipboard.writeText(posts.find(p=>p.id===id).text);toast('Post copied — paste it into Threads')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function planOne(id){const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',plan[id]||'');if(!value)return;plan[id]=value;savePlan();renderPosts()}
function autoPlan(){const start=document.getElementById('startDate').value;if(!start){alert('Choose a planning start date first.');return}const perDay=Number(document.getElementById('postsPerDay').value),times=['08:00','12:30','18:00'];visiblePosts().forEach((p,index)=>{const day=new Date(start+'T12:00:00');day.setDate(day.getDate()+Math.floor(index/perDay));const y=day.getFullYear(),m=String(day.getMonth()+1).padStart(2,'0'),d=String(day.getDate()).padStart(2,'0');plan[p.id]=`${y}-${m}-${d} ${times[index%perDay]}`});savePlan();renderPosts();toast('Planning created')}
function savePlan(){localStorage.setItem('pantryPlanContentPlan',JSON.stringify(plan))}
function clearPlan(){if(confirm('Clear the complete content plan?')){plan={};savePlan();renderPosts()}}
function renderPlanner(){const rows=posts.filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));document.getElementById('plannedCount').textContent=`${rows.length} planned`;document.getElementById('planner').innerHTML=rows.length?`<table><thead><tr><th>Date & time</th><th>Post</th><th>Opening</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${plan[p.id]}</td><td>${p.id}</td><td>${escapeHtml(p.hook)}</td><td><button class="btn ghost" onclick="copyPost(${p.id})">Copy</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posts planned yet.</div>'}
function downloadCSV(){const rows=[['Post','Theme','Opening','Full post','Planned date/time'],...posts.map(p=>[p.id,p.theme,p.hook,p.text,plan[p.id]||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PantryPlan-Threads-12-posts.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('startDate').value=new Date(Date.now()+86400000).toISOString().slice(0,10);renderPosts();
</script>
</body>
</html>
