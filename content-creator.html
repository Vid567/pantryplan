</style><link rel="stylesheet" href="design-system.css"></head><body><main class="wrap"><div class="top"><div><div class="brand">🥫 PantryPlan Content Creator</div><div class="sub">Copy and plan 50 English PantryPlan Threads posts.</div></div><div class="top-actions"><a class="btn secondary" href="index.html">PantryPlan</a><a class="btn secondary" href="PantryPlan-GUIDE.html">Guide</a><button class="btn secondary" onclick="downloadCSV()">Download CSV</button></div></div><section class="panel"><div class="controls"><div><label for="themeFilter">Theme</label><select id="themeFilter" onchange="renderPosts()"><option value="all">All themes</option><option>Relatable story</option><option>Waste & duplicates</option><option>Shopping clarity</option><option>Easy input</option><option>Simple & private</option></select></div><div><label for="count">Show posts</label><select id="count" onchange="renderPosts()"><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50" selected>50</option></select></div><div><label for="showProcessed">Post status</label><label class="status-toggle"><input id="showProcessed" type="checkbox" onchange="renderPosts()"> Show processed posts too</label></div><div><label for="startDate">Planning start date</label><input id="startDate" type="date"></div><div><label for="postsPerDay">Posts per day</label><select id="postsPerDay"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div><button class="btn primary" onclick="autoPlan()">Auto-plan visible posts</button></div><div class="stats"><span id="postCount"></span><span id="plannedCount"></span><span>Default times: 08:00 · 12:30 · 18:00</span></div><div class="progress"><strong id="processedCount"></strong><strong id="lastProcessed"></strong><strong id="nextPost"></strong></div><div class="notice">Copy a post to Threads. After you have posted or scheduled it there, click ✓ Processed. This status is stored ike a memory test.',body:'Do we have cereal?\nIs the oil nearly empty?\n\nNow I check the inventory.\nThe decision takes seconds.'},{theme:'Simple & private',hook:'Myth: home inventory needs hours of setup.',body:'Begin with ten common items.\nAdd more as you use them.\n\nYour inventory can grow\nwith your normal routine.'},{theme:'Shopping clarity',hook:'Before: buying just in case.',body:'After: checking what is at home.\n\nThe difference is one small habit.\nIt saves cupboard space\nand keeps the receipt shorter.'},{theme:'Simple & private',hook:'Your grocery list can stay private.',body:'No account is required.\nYour inventory stays on your device.\n\nSimple tools can be useful\nwithout collecting your household data.'},{theme:'Waste & duplicates',hook:'Use one before buying one.',body:'Pick one forgotten pantry item.\nPlan it into this week.\n\nThen replace it only if needed.\nThat is a tiny food-waste win.'},{theme:'Shopping clarity',hook:'A weekly grocery reset takes ten minutes.',body:'→ Check low-stock items\n→ Review the shopping list\n→ Find food to use soon\n→ Plan two easy meals\n\nThen stop.'},{theme:'Relatable story',hook:'A full cupboard can still feel empty.',body:'Food is hard to use\nwhen you cannot see what is there.\n\nGroup similar items.\nKeep a simple inventory.\nDinner becomes easier.'},{theme:'Shopping clarity',hook:'Do not make your list in the supermarket.',body:'Make it while checking the kitchen.\n\nYou will remember more,\nbuy fewer backups\nand spend less time in the aisles.'},{theme:'Easy input',hook:'The best inventory habit happens in the moment.',body:'Used the last can? Update it.\nOpened a new pack? Update it.\n\nTen seconds now\nprevents guessing later.'},{theme:'Waste & duplicates',hook:'Buying in bulk is not always saving.',body:'It only saves money\nwhen the food gets used.\n\nCheck space, current stock\nand real usage before buying more.'},{theme:'Simple & private',hook:'Inventory confidence feels surprisingly calm.',body:' a is not a product.',body:'It stays on your device.\nNobody else sees your grocery habits.'},{theme:'Simple & private',hook:'No ads between you and your shopping list.',body:'Just the list.\nThat is the whole app.'},{theme:'Simple & private',hook:'Simple does not mean limited.',body:'It means the features you do not need\nnever get in the way of the ones you do.'},{theme:'Simple & private',hook:'You do not need a tutorial to add a can of beans.',body:'If it takes longer to learn\nthan to use,\nit is not actually simple.'}
].map((p,i)=>({...p,id:i+1,text:i<25?`${p.hook}\n\n${p.body}\n\nTry PantryPlan free 👇\n${link}\n\nDM me with your feedback.`:`${p.hook}\n\n${p.body}\n\nTry PantryPlan free:\nhttps://vid567.github.io/apps/?product=pp\n\nDM me with your feedback.`}));
let plan=JSON.parse(localStorage.getItem('pantryPlanContentPlan')||'{}');let processed=JSON.parse(localStorage.getItem('pantryPlanContentProcessedV1')||'{}');const processedIds=Object.keys(processed);const hasOldBaseline=(processedIds.length===2||processedIds.length===3)&&Array.from({length:processedIds.length},(_,i)=>String(i+1)).every(id=>processedIds.includes(id));if(!processedIds.length||(processedIds.length===1&&processedIds[0]==='50')||hasOldBaseline){processed={};const restoredAt=new Date().toISOString();for(let id=1;id<=12;id++)processed[id]=restoredAt;localStorage.setItem('pantryPlanContentProcessedV1',JSON.stringify(processed))}
function visiblePosts(){const theme=document.getElementById('themeFilter').value,count=Number(document.getElementById('count').value),showProcessed=document.getElementById('showProcessed').checked;return posts.filter(p=>(theme==='all'||p.theme===theme)&&(showProcessed||!processed[p.id])).slice(0,count)}
function renderPosts(){const list=visiblePosts();document.getElementById('posts').innerHTML=list.map(p=>`<article class="card ${plan[p.id]?'scheduled':''} ${processed[p.id]?'processed':''}"><div class="card-head"><span class="number">Post ${p.id}</span><span class="theme">${p.theme}</span></div><div class="post">${escapeHtml(p.text)}</div><div class="actions"><button class="btn primary" onclick="copyPost(${p.id})">Copy</button><button class="btn secondary" onclick="planOne(${p.id})">${plan[p.id]?'Change time':'Plan'}</button>${processed[p.id]?`<button class="btn ghost processed-btn" onclick="toggleProcessed(${p.id})">✓ Processed</button>`:''}</div></article>`).join('');document.getElementById('postCount').textContent=`${list.length} posts shown`;renderPlanner();renderProgress()}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function copyPost(id){await navigator.clipboard.writeText(posts.find(p=>p.id===id).text);if(!processed[id]){processed[id]=new Date().toISOString();localStorage.setItem('pantryPlanContentProcessedV1',JSON.stringify(processed));renderPosts()}toast('Copied and marked as processed')}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function toggleProcessed(id){if(processed[id])delete processed[id];else processed[id]=new Date().toISOString();localStorage.setItem('pantryPlanContentProcessedV1',JSON.stringify(processed));renderPosts();toast(processed[id]?'Marked as processed':'Marked as not processed')}
function renderProgress(){const done=posts.filter(p=>processed[p.id]);document.getElementById('processedCount').textContent=`${done.length} of ${posts.length} processed`;const last=done.slice().sort((a,b)=>String(processed[b.id]).localeCompare(String(processed[a.id])))[0];document.getElementById('lastProcessed').textContent=last?`Last processed: Post ${last.id}`:'Last processed: none';const next=posts.find(p=>!processed[p.id]);document.getElementById('nextPost').textContent=next?`Next: Post ${next.id}`:'All posts processed ✓'}
function planOne(id){const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',plan[id]||'');if(!value)return;plan[id]=value;savePlan();renderPosts()}function autoPlan(){const start=document.getElementById('startDate').value;if(!start){alert('Choose a planning start date first.');return}const perDay=Number(document.getElementById('postsPerDay').value),times=['08:00','12:30','18:00'];visiblePosts().forEach((p,index)=>{const day=new Date(start+'T12:00:00');day.setDate(day.getDate()+Math.floor(index/perDay));const y=day.getFullYear(),m=String(day.getMonth()+1).padStart(2,'0'),d=String(day.getDate()).padStart(2,'0');plan[p.id]=`${y}-${m}-${d} ${times[index%perDay]}`});savePlan();renderPosts();toast('Planning created')}function savePlan(){localStorage.setItem('pantryPlanContentPlan',JSON.stringify(plan))}function clearPlan(){if(confirm('Clear the complete content plan?')){plan={};savePlan();renderPosts()}}
function renderPlanner(){const rows=posts.filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));document.getElementById('plannedCount').textContent=`${rows.length} planned`;document.getElementById('planner').innerHTML=rows.length?`<table><thead><tr><th>Date & time</th><th>Post</th><th>Opening</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${plan[p.id]}</td><td>${p.id}</td><td>${escapeHtml(p.hook.replaceAll('\n',' / '))}</td><td><button class="btn ghost" onclick="copyPost(${p.id})">Copy</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posts planned yet.</div>'}
function downloadCSV(){const rows=[['Post','Theme','Opening','Full post','Planned date/time','Processed'],...posts.map(p=>[p.id,p.theme,p.hook,p.text,plan[p.id]||'',processed[p.id]?'Yes':'No'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PantryPlan-Threads-50-posts.csv';a.click();URL.revokeObjectURL(a.href)}document.getElementById('startDate').value=new Date(Date.now()+86400000).toISOString().slice(0,10);renderPosts();
