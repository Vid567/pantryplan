<!doctype html><html lang="de-DE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const locale='de-DE';localStorage.setItem('pantryPlanLocale',locale);const frame=document.getElementById('app');const child=new URL('pantryplan-app.html',location.href);if(new URLSearchParams(location.search).get('join')==='beta')child.searchParams.set('join','beta');frame.src=child.href;
const EXACT=new Map([['Pantry','Vorrat'],['What you have at home.','Was du zu Hause hast.'],['Shopping list','Einkaufsliste'],['Check things off as you shop. Add whatever you spot.','Hake Produkte beim Einkaufen ab und füge hinzu, was noch fehlt.'],['Data & backup','Daten & Sicherung'],['Items','Produkte'],['Running low','Fast aufgebraucht'],['＋ Add item','＋ Produkt hinzufügen'],['＋ Add to list','＋ Zur Liste hinzufügen'],['Speak to add or update','Sprich, um hinzuzufügen oder zu aktualisieren'],['Speak to add or remove','Sprich, um hinzuzufügen oder zu entfernen'],['Listening… tap to stop','Hört zu… tippen zum Stoppen'],['● Recording — speak now','● Aufnahme läuft — jetzt sprechen'],['Undo last','Letzte Aktion rückgängig'],['Just added by voice','Per Sprache hinzugefügt'],['Done shopping — move bought items to pantry','Einkauf beendet — gekaufte Produkte in den Vorrat verschieben'],['Join the Free Beta','Kostenlose Beta testen'],['Join Free Beta','Kostenlose Beta testen'],['Export data','Daten exportieren'],['Import data','Daten importieren'],['Export','Exportieren'],['Import','Importieren'],['Backup','Sicherung'],['Add item','Produkt hinzufügen'],['Edit item','Produkt bearbeiten'],['Add to list','Zur Liste hinzufügen'],['Edit shopping item','Einkaufsprodukt bearbeiten'],['Name','Name'],['Quantity','Menge'],['Category','Kategorie'],['Low stock threshold','Warnschwelle für niedrigen Bestand'],['Photo','Foto'],['Take / choose photo','Foto aufnehmen / auswählen'],['Remove','Entfernen'],['Save','Speichern'],['Cancel','Abbrechen'],['Delete','Löschen'],['Close','Schließen'],['Done','Fertig'],['Edit','Bearbeiten'],['Staples','Grundnahrungsmittel'],['Fresh','Frische Produkte'],['Frozen','Tiefgekühlt'],['Drinks','Getränke'],['Snacks','Snacks'],['Household','Haushalt'],['Other','Sonstiges'],['Pantry is empty.','Dein Vorrat ist leer.'],['Your shopping list is empty.','Deine Einkaufsliste ist leer.'],['More','Mehr'],['Shopping','Einkaufen'],['Tap a product name to edit details or add a photo.','Tippe auf einen Produktnamen, um Details zu bearbeiten oder ein Foto hinzuzufügen.'],['Bought — add to pantry','Gekauft — zum Vorrat hinzufügen'],['to pantry','zum Vorrat'],['Microphone access denied','Mikrofonzugriff verweigert'],['No microphone was found','Kein Mikrofon gefunden'],['Voice not supported in this browser — try Chrome','Spracherkennung wird in diesem Browser nicht unterstützt — versuche Chrome'],['Voice recognition needs a network connection in this browser','Die Spracherkennung benötigt in diesem Browser eine Internetverbindung'],['Saved','Gespeichert'],['Removed','Entfernt'],['Added','Hinzugefügt'],['Updated','Aktualisiert'],['Backup restored ✓','Sicherung wiederhergestellt ✓'],["That file didn't look right",'Diese Datei scheint keine gültige Sicherung zu sein'],['Storage is full. The last change was not saved.','Der Speicher ist voll. Die letzte Änderung wurde nicht gespeichert.'],['Saved data could not be read. Import a backup to restore it.','Gespeicherte Daten konnten nicht gelesen werden. Importiere eine Sicherung, um sie wiederherzustellen.']]);
const PHRASES=[['Say as many items as you like —','Nenne so viele Produkte, wie du möchtest —'],['pause briefly between items','mache zwischen Produkten eine kurze Pause'],['Stops automatically after 10 seconds of silence.','Stoppt automatisch nach 10 Sekunden Stille.'],['Try:','Probiere:'],['out of eggs','Eier sind alle'],['remove pasta','Nudeln entfernen'],['got the milk','Milch gekauft'],['move bought items to pantry','gekaufte Produkte in den Vorrat verschieben'],['moved to pantry','in den Vorrat verschoben'],['item moved to pantry','Produkt in den Vorrat verschoben'],['items moved to pantry','Produkte in den Vorrat verschoben'],['pcs total','Stück insgesamt'],['shopping list','Einkaufsliste'],['Shopping list','Einkaufsliste'],['pantry','Vorrat'],['Pantry','Vorrat']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(EXACT.has(trim))return raw.replace(trim,EXACT.get(trim));let out=raw;for(const [a,b] of PHRASES)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
function normalizeGermanVoice(text){let s=String(text||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');const nums={ein:'one',eine:'one',einen:'one',eins:'one',zwei:'two',drei:'three',vier:'four',funf:'five',sechs:'six',sieben:'seven',acht:'eight',neun:'nine',zehn:'ten'};s=s.split(/\s+/).map(x=>nums[x]||x).join(' ');return s.replace(/\s+und\s+/g,' and ').replace(/\btuten?\s+(mit|von)?\s*/g,'bags of ').replace(/\bpackungen?\s+(mit|von)?\s*/g,'packs of ').replace(/^(entferne|entfernen|losche|loschen|nimm raus|rausnehmen)\s+(den|die|das|der)?\s*/,'remove ').replace(/^(keine|kein|nicht mehr|alle|aus)\s+(den|die|das|der)?\s*/,'out of ').replace(/^(gekauft|habe gekauft|ich habe gekauft)\s+(den|die|das|der)?\s*/,'got ');}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}try{if(typeof w.toggleMic==='function'){const src=w.toggleMic.toString(),patched=src.replace(/rec\.lang\s*=\s*[^;]+;/,`rec.lang='de-DE';`);if(patched!==src)w.eval(`toggleMic=${patched}`);}if(typeof w.handleVoice==='function'){const original=w.handleVoice;w.handleVoice=function(ctx,text){return original.call(this,ctx,normalizeGermanVoice(text));};}}catch(e){console.warn('German PantryPlan voice patch unavailable',e)}d.documentElement.lang='de';translate(d.body);try{if(typeof w.toast==='function'){const o=w.toast;w.toast=(m,...r)=>o(tr(m),...r);}const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),1000);});
</script></body></html>
