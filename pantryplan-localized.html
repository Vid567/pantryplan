<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const q=new URLSearchParams(location.search);
const requested=q.get('lang')||localStorage.getItem('pantryPlanLocale')||navigator.language||'en-US';
const locale=requested.trim()||'en-US';
const isNL=locale.toLowerCase().startsWith('nl');
localStorage.setItem('pantryPlanLocale',locale);
document.documentElement.lang=isNL?'nl':'en';
const child=new URL('pantryplan-app.html',location.href);
if(q.get('join')==='beta') child.searchParams.set('join','beta');
const frame=document.getElementById('app');
frame.src=child.href;

const NL_EXACT=new Map([
['Pantry','Voorraad'],['What you have at home.','Wat je thuis op voorraad hebt.'],
['Shopping list','Boodschappenlijst'],['Check things off as you shop. Add whatever you spot.','Vink producten af tijdens het winkelen. Voeg toe wat je nog nodig hebt.'],
['Data & backup','Gegevens & back-up'],['Items','Producten'],['Running low','Bijna op'],
['＋ Add item','＋ Product toevoegen'],['＋ Add to list','＋ Aan lijst toevoegen'],
['Speak to add or update','Spreek om toe te voegen of bij te werken'],['Speak to add or remove','Spreek om toe te voegen of te verwijderen'],
['Listening… tap to stop','Luisteren… tik om te stoppen'],['● Recording — speak now','● Opname actief — spreek nu'],
['Undo last','Laatste ongedaan maken'],['Just added by voice','Zojuist met spraak toegevoegd'],
['Done shopping — move bought items to pantry','Klaar met winkelen — gekochte producten naar voorraad'],
['Join the Free Beta','Doe mee met de gratis Beta'],['Join Free Beta','Doe mee met de gratis Beta'],
['Try PantryPlan first. If it helps, join the beta to share feedback and receive early updates.','Probeer PantryPlan eerst. Helpt het je, doe dan mee met de Beta om feedback te geven en vroege updates te ontvangen.'],
['Export data','Gegevens exporteren'],['Import data','Gegevens importeren'],['Export','Exporteren'],['Import','Importeren'],['Backup','Back-up'],
['Add item','Product toevoegen'],['Edit item','Product bewerken'],['Add to list','Aan lijst toevoegen'],['Edit shopping item','Boodschap bewerken'],
['Name','Naam'],['Quantity','Aantal'],['Category','Categorie'],['Low stock threshold','Waarschuwing bij lage voorraad'],['Photo','Foto'],['Take photo','Foto maken'],['Choose photo','Foto kiezen'],
['Save','Opslaan'],['Cancel','Annuleren'],['Delete','Verwijderen'],['Close','Sluiten'],['Done','Klaar'],['Edit','Bewerken'],
['Other','Overig'],['Dairy','Zuivel'],['Fruit','Fruit'],['Vegetables','Groente'],['Meat','Vlees'],['Fish','Vis'],['Frozen','Diepvries'],['Drinks','Dranken'],['Snacks','Snacks'],['Household','Huishouden'],['Cleaning','Schoonmaak'],['Personal care','Persoonlijke verzorging'],
['Pantry is empty.','Je voorraad is leeg.'],['Your shopping list is empty.','Je boodschappenlijst is leeg.'],['Nothing added yet.','Nog niets toegevoegd.'],
['On device','Op dit apparaat'],['On-device','Op dit apparaat'],['More','Meer'],['Shopping','Boodschappen'],
['Open PantryPlan','Open PantryPlan'],['Feedback','Feedback'],['Email','E-mail'],['First name','Voornaam'],['Phone','Telefoon'],['Submit','Versturen'],
['Microphone access denied','Toegang tot microfoon geweigerd'],['No microphone was found','Geen microfoon gevonden'],['Voice not supported in this browser — try Chrome','Spraak wordt niet ondersteund in deze browser — probeer Chrome'],['Voice recognition needs a network connection in this browser','Spraakherkenning heeft in deze browser een internetverbinding nodig'],
['Saved','Opgeslagen'],['Removed','Verwijderd'],['Deleted','Verwijderd'],['Added','Toegevoegd'],['Updated','Bijgewerkt'],['Low stock','Lage voorraad'],
['Open the next entry screen:','Open het volgende invoerscherm:'],['Tap a product name','Tik op een productnaam'],['Milk','Melk']
]);
const NL_PHRASES=[
['Speak clearly and firmly','Spreek duidelijk en rustig'],['keep your phone close','houd je telefoon dichtbij'],['pause briefly between items','pauzeer kort tussen producten'],['Stops automatically after 10 seconds of silence.','Stopt automatisch na 10 seconden stilte.'],
['Try:','Probeer:'],['out of eggs','eieren zijn op'],['remove pasta','verwijder pasta'],['got the milk','melk gekocht'],['remove bananas','verwijder bananen'],
['PantryPlan stores your pantry, shopping list and photos only on this device. Nothing is automatically uploaded.','PantryPlan bewaart je voorraad, boodschappenlijst en foto’s alleen op dit apparaat. Er wordt niets automatisch geüpload.'],
['move bought items to pantry','verplaats gekochte producten naar voorraad'],['moved to pantry','verplaatst naar voorraad'],['item moved to pantry','product verplaatst naar voorraad'],['items moved to pantry','producten verplaatst naar voorraad'],
['Just added by voice','Zojuist met spraak toegevoegd'],['pcs total','stuks totaal'],['Undone:','Ongedaan gemaakt:'],
['Open the next entry screen:','Open het volgende invoerscherm:'],['There you can edit details or add a photo.','Daar kun je gegevens wijzigen of een foto toevoegen.'],['for example','bijvoorbeeld'],
['Add whatever you spot.','Voeg toe wat je nog nodig hebt.'],['Check things off as you shop.','Vink producten af tijdens het winkelen.'],
['Your pantry','Je voorraad'],['shopping list','boodschappenlijst'],['Shopping list','Boodschappenlijst'],['pantry','voorraad'],['Pantry','Voorraad'],
['Running low','Bijna op'],['Items','Producten'],['item','product'],['items','producten'],
['Quantity','Aantal'],['Category','Categorie'],['Name','Naam'],['Photo','Foto'],['Save','Opslaan'],['Cancel','Annuleren'],['Delete','Verwijderen'],['Edit','Bewerken'],
['Add item','Product toevoegen'],['Add to list','Aan lijst toevoegen'],['Done shopping','Klaar met winkelen'],
['Recording','Opname'],['speak now','spreek nu'],['Listening','Luisteren'],['tap to stop','tik om te stoppen'],['Undo last','Laatste ongedaan maken'],
['Free Beta','gratis Beta'],['Join','Doe mee'],['Data & backup','Gegevens & back-up'],['Export data','Gegevens exporteren'],['Import data','Gegevens importeren']
];
function nlText(value){
 if(!isNL||!value) return value;
 const raw=String(value); const trimmed=raw.trim();
 if(NL_EXACT.has(trimmed)) return raw.replace(trimmed,NL_EXACT.get(trimmed));
 let out=raw;
 for(const [a,b] of NL_PHRASES) out=out.split(a).join(b);
 out=out.replace(/(\d+) item(s)? moved to voorraad/g,(_,n,s)=>`${n} product${n==='1'?'':'en'} verplaatst naar voorraad`)
        .replace(/Undone:\s*/g,'Ongedaan gemaakt: ')
        .replace(/Voice not supported in this browser[^.]*?/g,'Spraak wordt niet ondersteund in deze browser')
        .replace(/Microphone access denied/g,'Toegang tot microfoon geweigerd')
        .replace(/No microphone was found/g,'Geen microfoon gevonden');
 return out;
}
function translateNode(root){
 if(!isNL||!root) return;
 const doc=root.ownerDocument||root;
 const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
 for(const n of nodes){ if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName)) continue; const next=nlText(n.nodeValue); if(next!==n.nodeValue)n.nodeValue=next; }
 for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[]){
   for(const attr of ['placeholder','title','aria-label']) if(el.hasAttribute(attr)) el.setAttribute(attr,nlText(el.getAttribute(attr)));
 }
}
frame.addEventListener('load',()=>{
 const w=frame.contentWindow, d=frame.contentDocument;
 try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}
 try{
   if(typeof w.toggleMic==='function'){
     const source=w.toggleMic.toString(); const patched=source.replace(/rec\.lang\s*=\s*[^;]+;/,`rec.lang=${JSON.stringify(locale)};`); if(patched!==source)w.eval(`toggleMic = ${patched}`);
   }
 }catch(e){console.warn('PantryPlan locale patch could not be applied',e)}
 if(!isNL)return;
 d.documentElement.lang='nl';
 translateNode(d.body);
 try{
   if(typeof w.toast==='function'){const original=w.toast;w.toast=(msg,...rest)=>original(nlText(msg),...rest);}
   const originalConfirm=w.confirm.bind(w); w.confirm=(msg)=>originalConfirm(nlText(msg));
   const originalAlert=w.alert?.bind(w); if(originalAlert)w.alert=(msg)=>originalAlert(nlText(msg));
 }catch(e){}
 const obs=new MutationObserver(muts=>{for(const m of muts){for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE){const t=nlText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===Node.ELEMENT_NODE)translateNode(n);}}});
 obs.observe(d.body,{subtree:true,childList:true,characterData:false});
 setInterval(()=>translateNode(d.body),1200);
});
</script></body></html>
