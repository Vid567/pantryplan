<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const q=new URLSearchParams(location.search);
const requested=q.get('lang')||localStorage.getItem('pantryPlanLocale')||navigator.language||'en-US';
const locale=requested.trim()||'en-US';
const lang=locale.toLowerCase();
const isNL=lang.startsWith('nl'), isES=lang.startsWith('es');
localStorage.setItem('pantryPlanLocale',locale);
document.documentElement.lang=isNL?'nl':isES?'es':'en';
const child=new URL('pantryplan-app.html',location.href); if(q.get('join')==='beta')child.searchParams.set('join','beta');
const frame=document.getElementById('app'); frame.src=child.href;

const VOICE_EN={'hotmail':'oatmeal','hot mail':'oatmeal','x':'eggs','ex':'eggs','acts':'eggs','peace':'peas','piece':'peas','please':'peas','pees':'peas'};
const VOICE_NL={'hotmail':'havermout','hot mail':'havermout','peace':'erwten','piece':'erwten','please':'erwten','pees':'erwten','peas':'erwten','erwt':'erwten','erwten':'erwten'};
const VOICE_ES={'huebo':'huevos','huebos':'huevos','guevos':'huevos','arros':'arroz','platanos':'plátanos','platano':'plátano'};

const NL=new Map([
['Pantry','Voorraad'],['What you have at home.','Wat je thuis op voorraad hebt.'],['Shopping list','Boodschappenlijst'],['Data & backup','Gegevens & back-up'],['Items','Producten'],['Running low','Bijna op'],['＋ Add item','＋ Product toevoegen'],['＋ Add to list','＋ Aan lijst toevoegen'],['Speak to add or update','Spreek om toe te voegen of bij te werken'],['Speak to add or remove','Spreek om toe te voegen of te verwijderen'],['Listening… tap to stop','Luisteren… tik om te stoppen'],['● Recording — speak now','● Opname actief — spreek nu'],['Undo last','Laatste ongedaan maken'],['Done shopping — move bought items to pantry','Klaar met winkelen — gekochte producten naar voorraad'],['Join the Free Beta','Doe mee met de gratis Beta'],['Join Free Beta','Doe mee met de gratis Beta'],['Export data','Gegevens exporteren'],['Import data','Gegevens importeren'],['Add item','Product toevoegen'],['Edit item','Product bewerken'],['Add to list','Aan lijst toevoegen'],['Name','Naam'],['Quantity','Aantal'],['Category','Categorie'],['Photo','Foto'],['Take / choose photo','Foto maken / kiezen'],['Remove','Verwijderen'],['Save','Opslaan'],['Cancel','Annuleren'],['Delete','Verwijderen'],['Other','Overig'],['Frozen','Diepvries'],['Drinks','Dranken'],['Snacks','Snacks'],['Household','Huishouden'],['Pantry is empty.','Je voorraad is leeg.'],['Your shopping list is empty.','Je boodschappenlijst is leeg.'],['More','Meer'],['Shopping','Boodschappen'],['Microphone access denied','Toegang tot microfoon geweigerd'],['No microphone was found','Geen microfoon gevonden'],['Voice recognition needs a network connection in this browser','Spraakherkenning heeft in deze browser een internetverbinding nodig'],['Saved','Opgeslagen'],['Removed','Verwijderd'],['Added','Toegevoegd'],['Updated','Bijgewerkt']
]);

const ES=new Map([
['Pantry','Despensa'],['What you have at home.','Lo que tienes en casa.'],['Shopping list','Lista de la compra'],['Check things off as you shop. Add whatever you spot.','Marca los productos mientras compras. Añade lo que necesites.'],['Data & backup','Datos y copia de seguridad'],['Items','Productos'],['Running low','Quedan pocos'],['＋ Add item','＋ Añadir producto'],['＋ Add to list','＋ Añadir a la lista'],['Speak to add or update','Habla para añadir o actualizar'],['Speak to add or remove','Habla para añadir o eliminar'],['Listening… tap to stop','Escuchando… toca para detener'],['● Recording — speak now','● Grabando — habla ahora'],['Undo last','Deshacer último cambio'],['Just added by voice','Añadido por voz'],['Done shopping — move bought items to pantry','Compra terminada — mover productos comprados a la despensa'],['Join the Free Beta','Únete a la Beta gratuita'],['Join Free Beta','Únete a la Beta gratuita'],['Export data','Exportar datos'],['Import data','Importar datos'],['Export','Exportar'],['Import','Importar'],['Backup','Copia de seguridad'],['Add item','Añadir producto'],['Edit item','Editar producto'],['Add to list','Añadir a la lista'],['Edit shopping item','Editar producto de la compra'],['Name','Nombre'],['Quantity','Cantidad'],['Category','Categoría'],['Low stock threshold','Aviso de pocas existencias'],['Photo','Foto'],['Take / choose photo','Hacer / elegir foto'],['Remove','Eliminar'],['Save','Guardar'],['Cancel','Cancelar'],['Delete','Eliminar'],['Close','Cerrar'],['Done','Hecho'],['Edit','Editar'],['Staples','Básicos'],['Fresh','Frescos'],['Frozen','Congelados'],['Drinks','Bebidas'],['Snacks','Aperitivos'],['Household','Hogar'],['Other','Otros'],['Pantry is empty.','Tu despensa está vacía.'],['Your shopping list is empty.','Tu lista de la compra está vacía.'],['More','Más'],['Shopping','Compra'],['Tap a product name to edit details or add a photo.','Toca el nombre de un producto para editar sus datos o añadir una foto.'],['Bought — add to pantry','Comprado — añadir a la despensa'],['to pantry','a despensa'],['Microphone access denied','Acceso al micrófono denegado'],['No microphone was found','No se encontró ningún micrófono'],['Voice not supported in this browser — try Chrome','El reconocimiento de voz no es compatible con este navegador — prueba Chrome'],['Voice recognition needs a network connection in this browser','El reconocimiento de voz necesita conexión a Internet en este navegador'],['Saved','Guardado'],['Removed','Eliminado'],['Added','Añadido'],['Updated','Actualizado'],['Backup restored ✓','Copia de seguridad restaurada ✓'],["That file didn't look right",'El archivo no parece ser una copia válida'],['Storage is full. The last change was not saved.','El almacenamiento está lleno. El último cambio no se ha guardado.'],['Saved data could not be read. Import a backup to restore it.','No se pudieron leer los datos guardados. Importa una copia de seguridad para restaurarlos.']
]);

const NLP=[['Speak clearly and firmly','Spreek duidelijk en rustig'],['keep your phone close','houd je telefoon dichtbij'],['pause briefly between items','pauzeer kort tussen producten'],['Stops automatically after 10 seconds of silence.','Stopt automatisch na 10 seconden stilte.'],['out of eggs','eieren zijn op'],['remove pasta','verwijder pasta'],['got the milk','melk gekocht'],['move bought items to pantry','verplaats gekochte producten naar voorraad'],['moved to pantry','verplaatst naar voorraad'],['item moved to pantry','product verplaatst naar voorraad'],['items moved to pantry','producten verplaatst naar voorraad'],['pcs total','stuks totaal']];
const ESP=[['Say as many items as you like —','Di tantos productos como quieras —'],['pause briefly between items','haz una breve pausa entre productos'],['Stops automatically after 10 seconds of silence.','Se detiene automáticamente después de 10 segundos de silencio.'],['Try:','Prueba:'],['out of eggs','se acabaron los huevos'],['remove pasta','elimina pasta'],['got the milk','leche comprada'],['move bought items to pantry','mover productos comprados a la despensa'],['moved to pantry','movidos a la despensa'],['item moved to pantry','producto movido a la despensa'],['items moved to pantry','productos movidos a la despensa'],['pcs total','unidades en total'],['shopping list','lista de la compra'],['Shopping list','Lista de la compra'],['pantry','despensa'],['Pantry','Despensa']];

function tr(value){if((!isNL&&!isES)||value==null)return value;const raw=String(value),trim=raw.trim(),map=isNL?NL:ES;if(map.has(trim))return raw.replace(trim,map.get(trim));let out=raw;for(const [a,b] of (isNL?NLP:ESP))out=out.split(a).join(b);return out;}
function translate(root){if((!isNL&&!isES)||!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}

function normalizeSpanishVoice(text){
 let s=String(text||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const nums={un:'one',una:'one',uno:'one',dos:'two',tres:'three',cuatro:'four',cinco:'five',seis:'six',siete:'seven',ocho:'eight',nueve:'nine',diez:'ten'};
 s=s.split(/\s+/).map(x=>nums[x]||x).join(' ');
 s=s.replace(/\s+y\s+/g,' and ')
    .replace(/\bbolsas? de\b/g,'bags of')
    .replace(/\bpaquetes? de\b/g,'packs of')
    .replace(/^(elimina|eliminar|quita|quitar|borra|borrar)\s+/,'remove ')
    .replace(/^(se acabaron|se acabo|sin|no queda|no quedan)\s+(los|las|el|la)?\s*/,'out of ')
    .replace(/^(compre|comprado|comprada|comprados|compradas|ya compre)\s+(los|las|el|la)?\s*/,'got ');
 return s;
}

function installVoice(w){
 const map=isNL?VOICE_NL:isES?VOICE_ES:VOICE_EN; w.__ppVoiceMishears=map;
 try{w.eval(`fixMishear=function(name){const n=String(name||'').toLowerCase().trim();return window.__ppVoiceMishears[n]||name;};`);w.eval(`pickSpeechCandidate=function(alternatives){if(!alternatives.length)return '';const score=p=>p.toLowerCase().split(/\\s+/).reduce((n,x)=>n+(window.__ppVoiceMishears[x]?3:0),0);return alternatives.slice().sort((a,b)=>score(b)-score(a))[0];};`);}catch(e){console.warn('Voice mishear patch unavailable',e);}
 if(isES&&typeof w.handleVoice==='function'){
   const original=w.handleVoice;
   w.handleVoice=function(ctx,text){return original.call(this,ctx,normalizeSpanishVoice(text));};
 }
}

frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}
 try{if(typeof w.toggleMic==='function'){const src=w.toggleMic.toString(),patched=src.replace(/rec\.lang\s*=\s*[^;]+;/,`rec.lang=${JSON.stringify(locale)};`);if(patched!==src)w.eval(`toggleMic=${patched}`);}installVoice(w);}catch(e){console.warn('PantryPlan locale patch unavailable',e)}
 if(!isNL&&!isES)return;
 d.documentElement.lang=isNL?'nl':'es'; translate(d.body);
 try{if(typeof w.toast==='function'){const o=w.toast;w.toast=(m,...r)=>o(tr(m),...r);}const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}
 const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),1000);
});
</script></body></html>
