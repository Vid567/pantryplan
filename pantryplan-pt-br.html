<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PantryPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#faf7f2}iframe{display:block}</style></head><body><iframe id="app" title="PantryPlan" allow="microphone; camera"></iframe><script>
const locale='pt-BR';localStorage.setItem('pantryPlanLocale',locale);const frame=document.getElementById('app');const child=new URL('pantryplan-app.html',location.href);if(new URLSearchParams(location.search).get('join')==='beta')child.searchParams.set('join','beta');frame.src=child.href;
const EXACT=new Map([['Pantry','Despensa'],['What you have at home.','O que você tem em casa.'],['Shopping list','Lista de compras'],['Check things off as you shop. Add whatever you spot.','Marque os itens durante as compras e adicione o que estiver faltando.'],['Data & backup','Dados e backup'],['Items','Itens'],['Running low','Estoque baixo'],['＋ Add item','＋ Adicionar item'],['＋ Add to list','＋ Adicionar à lista'],['Speak to add or update','Fale para adicionar ou atualizar'],['Speak to add or remove','Fale para adicionar ou remover'],['Listening… tap to stop','Ouvindo… toque para parar'],['● Recording — speak now','● Gravando — fale agora'],['Undo last','Desfazer última ação'],['Just added by voice','Adicionado por voz'],['Done shopping — move bought items to pantry','Compras concluídas — mover itens comprados para a despensa'],['Join the Free Beta','Participar da Beta gratuita'],['Join Free Beta','Participar da Beta gratuita'],['Export data','Exportar dados'],['Import data','Importar dados'],['Export','Exportar'],['Import','Importar'],['Backup','Backup'],['Add item','Adicionar item'],['Edit item','Editar item'],['Add to list','Adicionar à lista'],['Edit shopping item','Editar item da lista'],['Name','Nome'],['Quantity','Quantidade'],['Category','Categoria'],['Low stock threshold','Limite de estoque baixo'],['Photo','Foto'],['Take / choose photo','Tirar / escolher foto'],['Remove','Remover'],['Save','Salvar'],['Cancel','Cancelar'],['Delete','Excluir'],['Close','Fechar'],['Done','Concluído'],['Edit','Editar'],['Staples','Básicos'],['Fresh','Frescos'],['Frozen','Congelados'],['Drinks','Bebidas'],['Snacks','Lanches'],['Household','Casa'],['Other','Outros'],['Pantry is empty.','Sua despensa está vazia.'],['Your shopping list is empty.','Sua lista de compras está vazia.'],['More','Mais'],['Shopping','Compras'],['Tap a product name to edit details or add a photo.','Toque no nome de um produto para editar os detalhes ou adicionar uma foto.'],['Bought — add to pantry','Comprado — adicionar à despensa'],['to pantry','para a despensa'],['Microphone access denied','Acesso ao microfone negado'],['No microphone was found','Nenhum microfone foi encontrado'],['Voice not supported in this browser — try Chrome','O reconhecimento de voz não é compatível com este navegador — tente o Chrome'],['Voice recognition needs a network connection in this browser','O reconhecimento de voz precisa de conexão com a internet neste navegador'],['Saved','Salvo'],['Removed','Removido'],['Added','Adicionado'],['Updated','Atualizado'],['Backup restored ✓','Backup restaurado ✓'],["That file didn't look right",'Esse arquivo não parece ser um backup válido'],['Storage is full. The last change was not saved.','O armazenamento está cheio. A última alteração não foi salva.'],['Saved data could not be read. Import a backup to restore it.','Os dados salvos não puderam ser lidos. Importe um backup para restaurá-los.']]);
const PHRASES=[['Say as many items as you like —','Diga quantos itens quiser —'],['pause briefly between items','faça uma breve pausa entre os itens'],['Stops automatically after 10 seconds of silence.','Para automaticamente após 10 segundos de silêncio.'],['Try:','Experimente:'],['out of eggs','acabaram os ovos'],['remove pasta','remover macarrão'],['got the milk','leite comprado'],['move bought items to pantry','mover itens comprados para a despensa'],['moved to pantry','movido para a despensa'],['item moved to pantry','item movido para a despensa'],['items moved to pantry','itens movidos para a despensa'],['pcs total','unidades no total'],['shopping list','lista de compras'],['Shopping list','Lista de compras'],['pantry','despensa'],['Pantry','Despensa']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(EXACT.has(trim))return raw.replace(trim,EXACT.get(trim));let out=raw;for(const [a,b] of PHRASES)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
function normalizePtVoice(text){let s=String(text||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const nums={um:'one',uma:'one',dois:'two',duas:'two',tres:'three',quatro:'four',cinco:'five',seis:'six',sete:'seven',oito:'eight',nove:'nine',dez:'ten'};s=s.split(/\s+/).map(x=>nums[x]||x).join(' ');return s.replace(/\s+e\s+/g,' and ').replace(/\bsacos? de\b/g,'bags of').replace(/\bpacotes? de\b/g,'packs of').replace(/^(remova|remover|tire|tirar|exclua|excluir)\s+(o|a|os|as)?\s*/,'remove ').replace(/^(acabou|acabaram|sem|nao tem|nao temos)\s+(o|a|os|as)?\s*/,'out of ').replace(/^(comprei|comprado|comprada|comprados|compradas)\s+(o|a|os|as)?\s*/,'got ');}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{Object.defineProperty(w.navigator,'language',{configurable:true,get:()=>locale});Object.defineProperty(w.navigator,'languages',{configurable:true,get:()=>[locale]});}catch(e){}try{if(typeof w.toggleMic==='function'){const src=w.toggleMic.toString(),patched=src.replace(/rec\.lang\s*=\s*[^;]+;/`rec.lang='pt-BR';`);if(patched!==src)w.eval(`toggleMic=${patched}`);}if(typeof w.handleVoice==='function'){const original=w.handleVoice;w.handleVoice=function(ctx,text){return original.call(this,ctx,normalizePtVoice(text));};}}catch(e){console.warn('Brazilian Portuguese voice patch unavailable',e)}d.documentElement.lang='pt-BR';translate(d.body);try{if(typeof w.toast==='function'){const o=w.toast;w.toast=(m,...r)=>o(tr(m),...r);}const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),1000);});
</script></body></html>
